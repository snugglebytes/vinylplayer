  // ---------- Add track via YouTube link ----------
  function extractVideoId(input){
    input = (input || '').trim();
    const m = input.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);
    if(m) return m[1];
    if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
    return null;
  }

  // ---------- Duplicate detection ("already imported" by title + artist) ----------
  function normKey(s){ return (s || '').trim().toLowerCase(); }
  function findDuplicateTrack(title, artist, excludeId){
    const nt = normKey(title);
    if(!nt) return null;
    const na = normKey(cleanArtist(artist));
    return tracks.find(t => t.id !== excludeId && normKey(t.title) === nt && normKey(cleanArtist(t.artist)) === na) || null;
  }
  let addFeedbackTimer = null;
  function showAddFeedback(msg){
    const el = document.getElementById('addFeedback');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(addFeedbackTimer);
    addFeedbackTimer = setTimeout(() => el.classList.remove('show'), 3500);
  }

  function addTrackFromUrl(){
    const input = document.getElementById('addUrlInput');
    const id = extractVideoId(input.value);
    if(!id){
      input.style.borderColor = 'var(--label-red)';
      setTimeout(() => { input.style.borderColor = ''; }, 1200);
      return;
    }
    // Instant check: this exact YouTube video is already in the library
    const existingByVideo = tracks.find(t => t.videoId === id);
    if(existingByVideo){
      showAddFeedback(`Already in your library — "${existingByVideo.title}"${cleanArtist(existingByVideo.artist) ? ' by ' + cleanArtist(existingByVideo.artist) : ''}.`);
      input.value = '';
      return;
    }
    const newTrack = { id: uid(), title: 'Loading title…', artist: '', album: '', art: '', videoId: id };
    tracks.push(newTrack);
    saveTracks();
    renderCrate(); renderPlaylistNav();
    input.value = '';
    fetchTitleFor(newTrack);
  }

  // YouTube's oEmbed thumbnail is usually the 4:3 hqdefault crop, which pads
  // 16:9 sources with black bars top/bottom — those bars survive a CSS
  // "cover" crop into a square since only the sides get cut. maxresdefault
  // is the raw 16:9 frame with no bars, so prefer it and only fall back
  // when it doesn't exist (YouTube serves a tiny grey placeholder for those).
  function fetchBestThumbnail(videoId){
    return new Promise((resolve) => {
      const maxres = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
      const probe = new Image();
      probe.onload = () => {
        resolve(probe.naturalWidth > 120 ? maxres : `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`);
      };
      probe.onerror = () => resolve(`https://img.youtube.com/vi/${videoId}/hqdefault.jpg`);
      probe.src = maxres;
    });
  }

  // Note: there's no public, key-free YT Music metadata API we can call from
  // the browser, so this pulls title/artist/art from YouTube's oEmbed endpoint
  // (the same info YT Music itself is generated from — usually the channel
  // name and thumbnail of the official upload). It's a good starting guess,
  // not guaranteed to match, so every field can be fixed via Edit afterward.
  function fetchTitleFor(track){
    fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${track.videoId}&format=json`)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        track.title = data.title || track.title;
        track.artist = cleanArtist(data.author_name || track.artist);
        const artPromise = track.art ? Promise.resolve(track.art) : fetchBestThumbnail(track.videoId);
        return artPromise.then((artUrl) => {
          if(!track.art) track.art = artUrl;
        });
      })
      .then(() => {
        // Same song already imported under a different video link
        const dupe = findDuplicateTrack(track.title, track.artist, track.id);
        if(dupe){
          tracks = tracks.filter(t => t.id !== track.id);
          saveTracks();
          renderCrate(); renderPlaylistNav(); renderUpNext();
          showAddFeedback(`Already have "${dupe.title}"${cleanArtist(dupe.artist) ? ' by ' + cleanArtist(dupe.artist) : ''} in your library.`);
          return;
        }
        saveTracks();
        renderCrate(); renderUpNext();
        if(queue[current] && queue[current].id === track.id){
          trackTitle.textContent = track.title;
          trackArtist.textContent = track.artist;
          updateLabel(track);
        }
      })
      .catch(() => {
        track.title = 'Untitled track';
        saveTracks();
        renderCrate();
      });
  }

  document.getElementById('addBtn').addEventListener('click', addTrackFromUrl);
  document.getElementById('addUrlInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addTrackFromUrl();
  });

  const sortBtn = document.getElementById('sortBtn');
  const sortIndicator = document.getElementById('sortIndicator');
  function updateSortUI(){
    sortBtn.classList.toggle('active', sortMode !== 'added');
    if(sortMode === 'added'){
      sortIndicator.style.display = 'none';
      sortBtn.title = 'Smart sort: off';
    } else {
      sortIndicator.style.display = 'block';
      sortIndicator.textContent = 'Grouped by ' + (sortMode === 'artist' ? 'artist' : 'album');
      sortBtn.title = 'Smart sort: by ' + sortMode;
    }
  }
  sortBtn.addEventListener('click', () => {
    sortMode = sortMode === 'added' ? 'artist' : sortMode === 'artist' ? 'album' : 'added';
    updateSortUI();
    renderCrate();
  });

  // ---------- Playback core ----------
  function loadCurrent(autoplay){
    const t = queue[current];
    if(!t) return;
    elapsed = 0;
    trackTitle.textContent = t.title;
    trackArtist.textContent = cleanArtist(t.artist);
    updateLabel(t);
    recordArt.style.backgroundImage = t.art ? `url("${t.art}")` : 'none';
    renderCrate();
    renderUpNext();
    if(ytReady){
      ytPlayer.loadVideoById(t.videoId);
      applyVolume();
      if(!autoplay) ytPlayer.pauseVideo();
      setPlaying(autoplay);
    }
  }

  function setPlaying(state){
    playing = state;
    record.classList.toggle('spinning', playing);
    tonearm.classList.toggle('playing', playing);
    playIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    if(ytReady){ playing ? ytPlayer.playVideo() : ytPlayer.pauseVideo(); }
    clearInterval(timer);
    if(playing){ timer = setInterval(tick, 500); }
    renderUpNext();
  }

  function tick(){
    if(!ytReady) return;
    elapsed = ytPlayer.getCurrentTime() || 0;
    duration = ytPlayer.getDuration() || duration;
    totalTimeEl.textContent = fmt(duration);
    updateProgress();
  }

  function updateProgress(){
    const pct = duration ? Math.min(100, (elapsed / duration) * 100) : 0;
    progressFill.style.width = pct + '%';
    progressKnob.style.left = pct + '%';
    curTimeEl.textContent = fmt(elapsed);
  }

  function randomIndexExcluding(exclude){
    if(queue.length <= 1) return 0;
    let i;
    do{ i = Math.floor(Math.random() * queue.length); } while(i === exclude);
    return i;
  }

  function nextTrack(){
    if(queue.length === 0) return;
    navHistory.push(current);
    let nextIndex;
    if(shuffle){
      nextIndex = randomIndexExcluding(current);
    } else {
      nextIndex = current + 1;
      if(nextIndex >= queue.length) nextIndex = 0;
    }
    current = nextIndex;
    loadCurrent(true);
  }

  function prevTrack(){
    if(queue.length === 0) return;
    if(shuffle && navHistory.length){
      current = navHistory.pop();
      loadCurrent(true);
      return;
    }
    current = (current - 1 + queue.length) % queue.length;
    loadCurrent(true);
  }

  playBtn.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('nextBtn').addEventListener('click', nextTrack);
  document.getElementById('prevBtn').addEventListener('click', prevTrack);

  progressTrack.addEventListener('click', (e) => {
    if(!ytReady) return;
    const rect = progressTrack.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    elapsed = pct * duration;
    ytPlayer.seekTo(elapsed, true);
    updateProgress();
  });

  // ---------- Volume ----------
  const volumeMuteIconPath = '<path d="M16.5 12L19 9.5m0 5L16.5 12"/><path d="M3 10v4h4l5 5V5L7 10H3z"/>';
  function volumeIconMarkup(){
    if(muted || volume === 0){
      return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>';
    }
    if(volume < 50){
      return '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v8.06c1.5-.74 2.5-2.26 2.5-4.03z"/></svg>';
    }
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v8.06c1.5-.74 2.5-2.26 2.5-4.03z"/><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
  }
  function updateVolumeUI(){
    const pct = muted ? 0 : volume;
    volumeFill.style.width = pct + '%';
    volumeKnob.style.left = pct + '%';
    volumeIcon.innerHTML = volumeIconMarkup();
    volumeIcon.title = muted ? 'Unmute' : 'Mute';
  }
  function applyVolume(){
    if(ytReady) ytPlayer.setVolume(muted ? 0 : volume);
  }
  function setVolume(v){
    volume = Math.max(0, Math.min(100, Math.round(v)));
    if(volume > 0) muted = false;
    localStorage.setItem('spindle_volume', String(volume));
    applyVolume();
    updateVolumeUI();
  }
  function volumeFromEvent(e){
    const rect = volumeTrack.getBoundingClientRect();
    const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    return pct * 100;
  }
  let draggingVolume = false;
  volumeTrack.addEventListener('mousedown', (e) => {
    draggingVolume = true;
    setVolume(volumeFromEvent(e));
  });
  window.addEventListener('mousemove', (e) => {
    if(!draggingVolume) return;
    setVolume(volumeFromEvent(e));
  });
  window.addEventListener('mouseup', () => { draggingVolume = false; });
  volumeTrack.addEventListener('touchstart', (e) => { draggingVolume = true; setVolume(volumeFromEvent(e)); }, { passive:true });
  volumeTrack.addEventListener('touchmove', (e) => { if(draggingVolume) setVolume(volumeFromEvent(e)); }, { passive:true });
  volumeTrack.addEventListener('touchend', () => { draggingVolume = false; });
  volumeIcon.addEventListener('click', () => {
    if(muted || volume === 0){
      muted = false;
      volume = prevVolume > 0 ? prevVolume : 80;
    } else {
      prevVolume = volume;
      muted = true;
    }
    localStorage.setItem('spindle_volume', String(volume));
    applyVolume();
    updateVolumeUI();
  });
  updateVolumeUI();

  // ---------- Shuffle / repeat ----------
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const repeatOneDot = document.getElementById('repeatOneDot');

  function updateShuffleUI(){ shuffleBtn.classList.toggle('active', shuffle); }
  function updateRepeatUI(){
    repeatBtn.classList.toggle('active', repeatMode !== 'off');
    repeatOneDot.classList.toggle('show', repeatMode === 'one');
    repeatBtn.title = repeatMode === 'off' ? 'Repeat off' : repeatMode === 'all' ? 'Repeat playlist' : 'Repeat one song';
  }
  shuffleBtn.addEventListener('click', () => {
    shuffle = !shuffle;
    navHistory = [];
    localStorage.setItem('spindle_shuffle', shuffle ? '1' : '0');
    updateShuffleUI();
  });
  repeatBtn.addEventListener('click', () => {
    repeatMode = repeatMode === 'off' ? 'all' : repeatMode === 'all' ? 'one' : 'off';
    localStorage.setItem('spindle_repeat', repeatMode);
    updateRepeatUI();
  });

  // ---------- Brand click: shuffle-play everything ----------
  document.getElementById('brandBtn').addEventListener('click', () => {
    if(tracks.length === 0) return;
    shuffle = true;
    localStorage.setItem('spindle_shuffle', '1');
    updateShuffleUI();
    queue = tracks.slice();
    queueLabel = 'All Songs';
    current = Math.floor(Math.random() * queue.length);
    navHistory = [];
    loadCurrent(true);
  });

  // ---------- Edit song modal ----------
  const editOverlay = document.getElementById('editOverlay');
  const editTitleInput = document.getElementById('editTitleInput');
  const editArtistInput = document.getElementById('editArtistInput');
  const editAlbumInput = document.getElementById('editAlbumInput');
  const editArtUrlInput = document.getElementById('editArtUrlInput');
  const editArtFileInput = document.getElementById('editArtFileInput');
  const editArtPreview = document.getElementById('editArtPreview');
  let editingTrackId = null;
  let editingArtData = '';

  function updateEditArtPreview(src){
    editArtPreview.style.backgroundImage = src ? `url("${src}")` : 'none';
  }

  function openEditModal(trackId){
    const t = trackById(trackId);
    if(!t) return;
    editingTrackId = trackId;
    editingArtData = (t.art && t.art.startsWith('data:')) ? t.art : '';
    editTitleInput.value = t.title || '';
    editArtistInput.value = cleanArtist(t.artist);
    editAlbumInput.value = t.album || '';
    editArtUrlInput.value = (t.art && !t.art.startsWith('data:')) ? t.art : '';
    editArtFileInput.value = '';
    updateEditArtPreview(t.art || '');
    editOverlay.classList.add('show');
  }
  function closeEditModal(){
    editOverlay.classList.remove('show');
    editingTrackId = null;
    editingArtData = '';
  }

  editArtUrlInput.addEventListener('input', () => {
    editingArtData = '';
    updateEditArtPreview(editArtUrlInput.value.trim());
  });
  editArtFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      editingArtData = reader.result;
      editArtUrlInput.value = '';
      updateEditArtPreview(editingArtData);
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('editSaveBtn').addEventListener('click', () => {
    const t = trackById(editingTrackId);
    if(!t) return;
    t.title = editTitleInput.value.trim() || t.title;
    t.artist = cleanArtist(editArtistInput.value.trim());
    t.album = editAlbumInput.value.trim();
    const urlArt = editArtUrlInput.value.trim();
    t.art = editingArtData || urlArt || '';
    saveTracks();
    renderCrate(); renderPlaylistNav(); renderUpNext();
    if(queue[current] && queue[current].id === t.id){
      trackTitle.textContent = t.title;
      trackArtist.textContent = cleanArtist(t.artist);
      updateLabel(t);
      recordArt.style.backgroundImage = t.art ? `url("${t.art}")` : 'none';
    }
    closeEditModal();
  });
  document.getElementById('editCancelBtn').addEventListener('click', closeEditModal);
  document.getElementById('editCloseX').addEventListener('click', closeEditModal);
  editOverlay.addEventListener('click', (e) => { if(e.target === editOverlay) closeEditModal(); });

  // ---------- Edit album modal ----------
  // Editing an album applies the name/artist/art change to every track that
  // currently shares this album's (name + artist) key — that's what keeps
  // "same album, same artist" songs grouped, and lets one art upload cover
  // the whole album at once.
  const albumEditOverlay = document.getElementById('albumEditOverlay');
  const albumEditNameInput = document.getElementById('albumEditNameInput');
  const albumEditArtistInput = document.getElementById('albumEditArtistInput');
  const albumEditArtUrlInput = document.getElementById('albumEditArtUrlInput');
  const albumEditArtFileInput = document.getElementById('albumEditArtFileInput');
  const albumEditArtPreview = document.getElementById('albumEditArtPreview');
  let editingAlbumKey = null;
  let editingAlbumArtData = '';

  function updateAlbumEditArtPreview(src){
    albumEditArtPreview.style.backgroundImage = src ? `url("${src}")` : 'none';
  }

  function openAlbumEditModal(key){
    const al = getAlbums().find(a => a.key === key);
    if(!al) return;
    editingAlbumKey = key;
    const art = albumArtFor(al);
    editingAlbumArtData = art.startsWith('data:') ? art : '';
    albumEditNameInput.value = al.name;
    albumEditArtistInput.value = al.artist;
    albumEditArtUrlInput.value = (art && !art.startsWith('data:')) ? art : '';
    albumEditArtFileInput.value = '';
    updateAlbumEditArtPreview(art);
    albumEditOverlay.classList.add('show');
  }
  function closeAlbumEditModal(){
    albumEditOverlay.classList.remove('show');
    editingAlbumKey = null;
    editingAlbumArtData = '';
  }

  albumEditArtUrlInput.addEventListener('input', () => {
    editingAlbumArtData = '';
    updateAlbumEditArtPreview(albumEditArtUrlInput.value.trim());
  });
  albumEditArtFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      editingAlbumArtData = reader.result;
      albumEditArtUrlInput.value = '';
      updateAlbumEditArtPreview(editingAlbumArtData);
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('albumEditSaveBtn').addEventListener('click', () => {
    if(!editingAlbumKey) return;
    const newName = albumEditNameInput.value.trim();
    if(!newName) return;
    const newArtist = albumEditArtistInput.value.trim();
    const urlArt = albumEditArtUrlInput.value.trim();
    const newArt = editingAlbumArtData || urlArt || '';
    const affected = tracks.filter(t => (t.album || '').trim() && albumKey(t.album, t.artist) === editingAlbumKey);
    affected.forEach(t => {
      t.album = newName;
      if(newArtist) t.artist = newArtist;
      if(newArt) t.art = newArt;
    });
    saveTracks();
    renderCrate(); renderPlaylistNav(); renderUpNext();
    if(queue[current] && affected.some(t => t.id === queue[current].id)){
      const t = queue[current];
      trackTitle.textContent = t.title;
      trackArtist.textContent = cleanArtist(t.artist);
      updateLabel(t);
      recordArt.style.backgroundImage = t.art ? `url("${t.art}")` : 'none';
    }
    closeAlbumEditModal();
    openExtPanel('albums');
  });
  document.getElementById('albumEditCancelBtn').addEventListener('click', closeAlbumEditModal);
  document.getElementById('albumEditCloseX').addEventListener('click', closeAlbumEditModal);
  albumEditOverlay.addEventListener('click', (e) => { if(e.target === albumEditOverlay) closeAlbumEditModal(); });

  // ---------- Init ----------
  updateShuffleUI();
  updateRepeatUI();
  updateSortUI();
  extView = 'all';
  renderPlaylistNav();
  renderCrate();
  closeExtPanel(); // start closed, just initializes state cleanly
  trackTitle.textContent = queue[0] ? queue[0].title : '—';
  trackArtist.textContent = queue[0] ? cleanArtist(queue[0].artist) : '—';
  updateLabel(queue[0]);
  recordArt.style.backgroundImage = (queue[0] && queue[0].art) ? `url("${queue[0].art}")` : 'none';
  renderUpNext();
  syncVolumeRowWidth();
</script>

</body>
</html>
