  function currentPlaylistView(){
    if(extView === 'all' || extView === 'albums' || extView === 'artists') return null;
    if(extView && (extView.startsWith('album:') || extView.startsWith('artist:'))) return null;
    return playlists.find(p => p.id === extView) || null;
  }

  // Suggestions for the bottom of an open playlist: other library tracks not
  // already in it, scored by how well they match the playlist's "vibe" —
  // shared artists, shared albums, and overlapping words in the title (e.g.
  // "Live", "Remix", "Acoustic") — like the "suggested songs" YT Music
  // appends under a playlist. A small random jitter keeps ties from always
  // resolving the same way, and Refresh excludes what's already been shown.
  const SUGGESTION_STOPWORDS = new Set(['the','a','an','feat','featuring','ft','official','video','audio','lyric','lyrics','remix','edit','version','with','and','of']);
  function titleTokens(s){
    return (s || '').toLowerCase()
      .replace(/[()\[\]\-_,.'"!?]/g, ' ')
      .split(/\s+/)
      .filter(w => w.length > 2 && !SUGGESTION_STOPWORDS.has(w));
  }
  function getPlaylistSuggestions(pl, limit, excludeIds){
    excludeIds = excludeIds || new Set();
    const existing = new Set(pl.trackIds);
    const plTracks = pl.trackIds.map(trackById).filter(Boolean);
    const artistSet = new Set(plTracks.map(t => normKey(cleanArtist(t.artist))));
    const albumSet = new Set(plTracks.map(t => (t.album || '').trim().toLowerCase()).filter(Boolean));
    const wordCounts = new Map();
    plTracks.forEach(t => titleTokens(t.title).forEach(w => wordCounts.set(w, (wordCounts.get(w) || 0) + 1)));

    const candidates = tracks.filter(t => !existing.has(t.id) && !excludeIds.has(t.id));
    const scored = candidates.map(t => {
      let score = 0;
      if(artistSet.has(normKey(cleanArtist(t.artist)))) score += 3;
      const alb = (t.album || '').trim().toLowerCase();
      if(alb && albumSet.has(alb)) score += 2;
      titleTokens(t.title).forEach(w => { if(wordCounts.has(w)) score += 0.5; });
      score += Math.random() * 0.4; // jitter: variety on refresh, breaks ties
      return { t, score };
    });
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, limit).map(s => s.t);
  }

  // Tracks which suggestions have already been surfaced per playlist, so
  // hitting Refresh brings up a genuinely different batch instead of the
  // same tracks reshuffled.
  const suggestionExclude = new Map(); // playlistId -> Set<trackId>
  function getSuggestionExcludeSet(plId){
    if(!suggestionExclude.has(plId)) suggestionExclude.set(plId, new Set());
    return suggestionExclude.get(plId);
  }

  function shuffleArray(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Point playback at a fresh list. If shuffle is on, the list is shuffled
  // immediately so the Up Next panel always shows the order that's actually
  // going to play.
  function setQueue(list, label, playlistId){
    queueLabel = label;
    queuePlaylistId = playlistId || null;
    preShuffleQueue = null;
    queue = shuffle ? shuffleArray(list) : list.slice();
  }

  // Resolves an ext-panel view to a real playlist id, or null if the view
  // isn't backed by an actual playlist (All Songs, Albums, Artists, a
  // specific album/artist grouping).
  function playlistIdForView(view){
    if(!view || view === 'all' || view === 'albums' || view === 'artists') return null;
    if(view.startsWith('album:') || view.startsWith('artist:')) return null;
    const pl = playlists.find(p => p.id === view);
    return pl ? pl.id : null;
  }

  function playSuggestedTrack(t, suggestions){
    setQueue(suggestions, 'Suggested');
    current = queue.findIndex(x => x.id === t.id);
    if(current < 0) current = 0;
    renderUpNext();
    loadCurrent(true);
  }

  function renderSuggestionRow(t, container, pl, suggestions){
    const row = document.createElement('div');
    row.className = 'track-row suggestion-row';
    row.innerHTML = `
      <div class="mini-disc${t.art ? ' has-art' : ''}"${t.art ? ` style="background-image:url('${t.art}')"` : ''}></div>
      <div class="track-meta">
        <div class="t">${escapeHtml(t.title)}</div>
        <div class="a">${escapeHtml(cleanArtist(t.artist))}</div>
      </div>
      <div class="track-actions">
        <button class="icon-btn add-suggestion-btn" title="Add to playlist">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    `;
    row.querySelector('.track-meta').addEventListener('click', () => playSuggestedTrack(t, suggestions));
    row.querySelector('.mini-disc').addEventListener('click', () => playSuggestedTrack(t, suggestions));
    row.querySelector('.add-suggestion-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if(!pl.trackIds.includes(t.id)){
        pl.trackIds.push(t.id);
        savePlaylists();
        renderPlaylistNav();
        renderCrate();
      }
    });
    container.appendChild(row);
  }

  function renderSuggestions(pl){
    const excludeSet = getSuggestionExcludeSet(pl.id);
    let suggestions = getPlaylistSuggestions(pl, 8, excludeSet);
    if(suggestions.length === 0 && excludeSet.size > 0){
      // Ran out of fresh picks — start the rotation over.
      excludeSet.clear();
      suggestions = getPlaylistSuggestions(pl, 8, excludeSet);
    }
    if(suggestions.length === 0) return;

    const header = document.createElement('div');
    header.className = 'suggestions-header';
    const label = document.createElement('span');
    label.textContent = 'Suggested';
    header.appendChild(label);
    const refreshBtn = document.createElement('button');
    refreshBtn.className = 'icon-btn suggestions-refresh-btn';
    refreshBtn.title = 'Refresh suggestions';
    refreshBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/></svg>';
    refreshBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      refreshBtn.classList.add('spin');
      suggestions.forEach(t => excludeSet.add(t.id));
      renderCrate();
    });
    header.appendChild(refreshBtn);
    crate.appendChild(header);
    suggestions.forEach(t => renderSuggestionRow(t, crate, pl, suggestions));
  }

  function renderCrate(){
    crate.innerHTML = '';

    if(extView === 'albums'){
      let albums = getAlbums();
      if(extSearchTerm){
        albums = albums.filter(al => al.name.toLowerCase().includes(extSearchTerm) || al.artist.toLowerCase().includes(extSearchTerm));
      }
      if(albums.length === 0){
        crate.innerHTML = '<div class="crate-empty">' +
          (extSearchTerm ? 'No albums match your search.' : 'No albums yet. Tag a song with an album (or edit one) to see it here.') +
          '</div>';
        return;
      }
      albums.forEach(al => renderAlbumRow(al, crate));
      return;
    }

    if(extView === 'artists'){
      let artists = getArtists();
      if(extSearchTerm){
        artists = artists.filter(ar => ar.name.toLowerCase().includes(extSearchTerm));
      }
      if(artists.length === 0){
        crate.innerHTML = '<div class="crate-empty">' +
          (extSearchTerm ? 'No artists match your search.' : 'No artists yet. Add some songs to see them here.') +
          '</div>';
        return;
      }
      artists.forEach(ar => renderArtistRow(ar, crate));
      return;
    }

    const pl = currentPlaylistView();
    const list = visibleTracks();
    if(list.length === 0){
      crate.innerHTML = '<div class="crate-empty">' +
        (extSearchTerm ? 'No songs match your search.' : (extView === 'all' ? 'No songs yet. Paste a YouTube link above to add one.' : 'No songs here yet.')) +
        '</div>';
      if(pl && !extSearchTerm) renderSuggestions(pl);
      return;
    }

    const grouping = (extView === 'all' && sortMode !== 'added');
    if(!grouping){
      list.forEach(t => renderTrackRow(t, crate));
      if(pl && !extSearchTerm) renderSuggestions(pl);
      return;
    }

    // Smart sort: group by artist or album, alphabetically
    const key = sortMode === 'artist' ? 'artist' : 'album';
    const groups = new Map();
    list.forEach(t => {
      const raw = (t[key] || '').trim();
      const label = raw || (key === 'album' ? 'No album tagged' : 'Unknown artist');
      if(!groups.has(label)) groups.set(label, []);
      groups.get(label).push(t);
    });
    const sortedLabels = Array.from(groups.keys()).sort((a,b) => a.localeCompare(b));
    sortedLabels.forEach(label => {
      const header = document.createElement('div');
      header.className = 'group-header';
      header.textContent = label + ' · ' + groups.get(label).length;
      crate.appendChild(header);
      groups.get(label).forEach(t => renderTrackRow(t, crate));
    });
  }

  function playFromList(list, trackId){
    setQueue(list, extView === 'all' ? 'All Songs' : (playlists.find(p => p.id === extView) || {}).name || 'Playlist', playlistIdForView(extView));
    current = queue.findIndex(t => t.id === trackId);
    if(current < 0) current = 0;
    renderUpNext();
    loadCurrent(true);
  }

  function removeTrackEverywhere(trackId){
    tracks = tracks.filter(t => t.id !== trackId);
    playlists.forEach(pl => { pl.trackIds = pl.trackIds.filter(id => id !== trackId); });
    queue = queue.filter(t => t.id !== trackId);
    if(tracks.length === 0){ tracks = DEFAULT_TRACKS.slice(); queue = tracks.slice(); }
    if(current >= queue.length) current = Math.max(0, queue.length - 1);
    saveTracks(); savePlaylists();
    renderCrate(); renderPlaylistNav(); renderUpNext();
    if(queue[current]) loadCurrent(false);
  }

  function removeTrackFromPlaylist(playlistId, trackId){
    const pl = playlists.find(p => p.id === playlistId);
    if(!pl) return;
    pl.trackIds = pl.trackIds.filter(id => id !== trackId);
    savePlaylists();
    renderCrate(); renderPlaylistNav();
  }

  // ---------- Quick add-to-playlist popover ----------
  const popover = document.getElementById('playlistPopover');
  function showPlaylistPopover(anchor, trackId){
    const rect = anchor.getBoundingClientRect();
    popover.style.top = (rect.bottom + 6) + 'px';
    popover.style.left = Math.min(rect.left, window.innerWidth - 210) + 'px';
    if(playlists.length === 0){
      popover.innerHTML = '<div class="pp-empty">No playlists yet — create one from the menu.</div>';
    } else {
      popover.innerHTML = '<div class="pp-label">Add to playlist</div>' + playlists.map(pl => {
        const checked = pl.trackIds.includes(trackId);
        return `<div class="pp-item" data-pl="${pl.id}">
          <div class="pp-check ${checked ? 'checked' : ''}"></div>
          <span>${escapeHtml(pl.name)}</span>
        </div>`;
      }).join('');
      popover.querySelectorAll('.pp-item').forEach(item => {
        item.addEventListener('click', () => {
          const plId = item.getAttribute('data-pl');
          const pl = playlists.find(p => p.id === plId);
          const idx = pl.trackIds.indexOf(trackId);
          if(idx >= 0) pl.trackIds.splice(idx, 1); else pl.trackIds.push(trackId);
          savePlaylists();
          item.querySelector('.pp-check').classList.toggle('checked');
          renderPlaylistNav();
        });
      });
    }
    popover.classList.add('show');
  }
  document.addEventListener('click', (e) => {
    if(!popover.contains(e.target) && !e.target.closest('.add-to-playlist-btn')){
      popover.classList.remove('show');
    }
  });

  // ---------- Track context menu (the "…" button on any track row) ----------
  const trackContextMenu = document.getElementById('trackContextMenu');
  const TCM_ICONS = {
    queue: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 12h13M3 18h7"/><path d="M18 14v7M14.5 17.5h7"/></svg>',
    playNext: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11M3 12h11M3 18h7"/><path d="M15 8l5 4-5 4"/></svg>',
    edit: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    playlist: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 12h13M3 18h7"/><circle cx="19" cy="16" r="3"/><path d="M19 14v-8"/></svg>',
    album: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>',
    artist: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'
  };

  // Insert a track right after the currently-playing one; if it's already
  // queued elsewhere, it's moved rather than duplicated.
  function playNextTrack(t){
    const idx = queue.findIndex(q => q.id === t.id);
    if(idx !== -1){
      queue.splice(idx, 1);
      if(idx < current) current -= 1;
      if(idx === current) current = Math.max(0, current);
    }
    queue.splice(current + 1, 0, t);
    renderUpNext();
  }
  function addTrackToQueue(t){
    if(queue.some(q => q.id === t.id)) return;
    queue.push(t);
    renderUpNext();
  }
  function removeFromQueueOnly(trackId){
    const idx = queue.findIndex(q => q.id === trackId);
    if(idx === -1) return;
    queue.splice(idx, 1);
    if(idx < current) current -= 1;
    else if(current >= queue.length) current = Math.max(0, queue.length - 1);
    renderUpNext();
    if(queue[current]) loadCurrent(false);
  }

  let tcmCurrentTrack = null;
  let tcmKeyHandler = null;

  function closeTrackContextMenu(){
    trackContextMenu.classList.remove('show');
    tcmCurrentTrack = null;
    if(tcmKeyHandler){ document.removeEventListener('keydown', tcmKeyHandler); tcmKeyHandler = null; }
  }

  function showTrackContextMenu(anchor, t, opts){
    opts = opts || {};
    const source = opts.source || 'library';
    tcmCurrentTrack = t;

    const items = [];
    if(source !== 'upnext'){
      items.push({ key:'q', label:'Add to Queue', shortcut:'Q', icon:TCM_ICONS.queue, action: () => addTrackToQueue(t) });
    }
    items.push({ key:'n', label:'Play Next', shortcut:'N', icon:TCM_ICONS.playNext, action: () => playNextTrack(t) });
    items.push({ key:'e', label:'Edit', shortcut:'E', icon:TCM_ICONS.edit, action: () => openEditModal(t.id) });
    items.push({ key:'p', label:'Add to Playlist', shortcut:'P', icon:TCM_ICONS.playlist, action: (e) => showPlaylistPopover(anchor, t.id) });
    items.push({ sep:true });
    items.push({ key:'delete', label:'Delete', shortcut:'⌫', icon:TCM_ICONS.trash, danger:true, action: () => {
      if(source === 'upnext') removeFromQueueOnly(t.id);
      else if(source === 'playlist') removeTrackFromPlaylist(opts.playlistId, t.id);
      else removeTrackEverywhere(t.id);
    }});
    if((t.album || '').trim()){
      items.push({ key:'a', label:'Go to Album', shortcut:'A', icon:TCM_ICONS.album, action: () => openExtPanel('album:' + albumKey(t.album, t.artist)) });
    }
    if(cleanArtist(t.artist).trim()){
      items.push({ key:'r', label:'Go to Artist', shortcut:'R', icon:TCM_ICONS.artist, action: () => openExtPanel('artist:' + normKey(cleanArtist(t.artist))) });
    }

    trackContextMenu.innerHTML = items.map(it => {
      if(it.sep) return '<div class="tcm-sep"></div>';
      return `<div class="tcm-item${it.danger ? ' tcm-danger' : ''}" data-key="${it.key}">
        <div class="tcm-icon">${it.icon}</div>
        <div class="tcm-label">${it.label}</div>
        <div class="tcm-key">${it.shortcut}</div>
      </div>`;
    }).join('');

    items.filter(it => !it.sep).forEach(it => {
      const el = trackContextMenu.querySelector(`.tcm-item[data-key="${it.key}"]`);
      if(el) el.addEventListener('click', (e) => { e.stopPropagation(); it.action(e); closeTrackContextMenu(); });
    });

    const rect = anchor.getBoundingClientRect();
    trackContextMenu.style.top = (rect.bottom + 6) + 'px';
    trackContextMenu.style.left = Math.min(rect.left, window.innerWidth - 230) + 'px';
    trackContextMenu.classList.add('show');
    popover.classList.remove('show');

    tcmKeyHandler = (e) => {
      if(e.key === 'Escape'){ closeTrackContextMenu(); return; }
      const tag = (e.target && e.target.tagName) || '';
      if(tag === 'INPUT' || tag === 'TEXTAREA') return;
      const k = e.key.toLowerCase();
      const match = items.find(it => !it.sep && (it.key === k || (it.key === 'delete' && (e.key === 'Backspace' || e.key === 'Delete'))));
      if(match){
        e.preventDefault();
        match.action(e);
        closeTrackContextMenu();
      }
    };
    document.addEventListener('keydown', tcmKeyHandler);
  }

  document.addEventListener('click', (e) => {
    if(!trackContextMenu.contains(e.target) && !e.target.closest('.track-menu-btn') && !e.target.closest('.upnext-menu-btn')){
      closeTrackContextMenu();
    }
  });

  // ---------- Add track via YouTube link ----------
  function extractVideoId(input){
    input = (input || '').trim();
    const m = input.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);
    if(m) return m[1];
    if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
    return null;
  }

  // ---------- Duplicate detection ("already imported" by title + artist) ----------
  function normKey(s){ return (s || '').trim().toLowerCase(); }
  function findDuplicateTrack(title, artist, excludeId){
    const nt = normKey(title);
    if(!nt) return null;
    const na = normKey(cleanArtist(artist));
    return tracks.find(t => t.id !== excludeId && normKey(t.title) === nt && normKey(cleanArtist(t.artist)) === na) || null;
  }
  let addFeedbackTimer = null;
  function showAddFeedback(msg, targetId){
    const el = document.getElementById(targetId || 'addFeedback');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(addFeedbackTimer);
    addFeedbackTimer = setTimeout(() => el.classList.remove('show'), 3500);
  }

  function addTrackFromUrl(){
    const input = document.getElementById('addUrlInput');
    const id = extractVideoId(input.value);
    if(!id){
      input.style.borderColor = 'var(--label-red)';
      setTimeout(() => { input.style.borderColor = ''; }, 1200);
      return;
    }
    // Instant check: this exact YouTube video is already in the library
    const existingByVideo = tracks.find(t => t.videoId === id);
    if(existingByVideo){
      showAddFeedback(`Already in your library — "${existingByVideo.title}"${cleanArtist(existingByVideo.artist) ? ' by ' + cleanArtist(existingByVideo.artist) : ''}.`);
      input.value = '';
      return;
    }
    const newTrack = { id: uid(), title: 'Loading title…', artist: '', album: '', art: '', videoId: id, _feedbackTarget: 'addFeedback' };
    tracks.unshift(newTrack);
    saveTracks();
    renderCrate(); renderPlaylistNav();
    input.value = '';
    fetchTitleFor(newTrack);
  }

  // ---------- Add track via the Up Next panel's own paste-link field ----------
  // Always lands in All Songs (added to the top). If the queue is currently
  // playing from a specific playlist, it's also added to that playlist and
  // to the live Up Next queue. Fully independent from the sidebar's add field.
  function addTrackFromUrlToUpNext(){
    const input = document.getElementById('upnextAddUrlInput');
    const id = extractVideoId(input.value);
    if(!id){
      input.style.borderColor = 'var(--label-red)';
      setTimeout(() => { input.style.borderColor = ''; }, 1200);
      return;
    }
    const existingByVideo = tracks.find(t => t.videoId === id);
    if(existingByVideo){
      showAddFeedback(`Already in your library — "${existingByVideo.title}"${cleanArtist(existingByVideo.artist) ? ' by ' + cleanArtist(existingByVideo.artist) : ''}.`, 'upnextAddFeedback');
      input.value = '';
      return;
    }
    const newTrack = { id: uid(), title: 'Loading title…', artist: '', album: '', art: '', videoId: id, _feedbackTarget: 'upnextAddFeedback' };
    tracks.unshift(newTrack);
    queue.splice(current + 1, 0, newTrack);
    if(queuePlaylistId){
      const pl = playlists.find(p => p.id === queuePlaylistId);
      if(pl && !pl.trackIds.includes(newTrack.id)) pl.trackIds.push(newTrack.id);
      savePlaylists();
    }
    saveTracks();
    renderCrate(); renderPlaylistNav(); renderUpNext();
    input.value = '';
    fetchTitleFor(newTrack);
  }

  // YouTube's oEmbed thumbnail is usually the 4:3 hqdefault crop, which pads
  // 16:9 sources with black bars top/bottom — those bars survive a CSS
  // "cover" crop into a square since only the sides get cut. maxresdefault
  // is the raw 16:9 frame with no bars, so prefer it and only fall back
  // when it doesn't exist (YouTube serves a tiny grey placeholder for those).
  function fetchBestThumbnail(videoId){
    return new Promise((resolve) => {
      const maxres = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
      const probe = new Image();
      probe.onload = () => {
        resolve(probe.naturalWidth > 120 ? maxres : `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`);
      };
      probe.onerror = () => resolve(`https://img.youtube.com/vi/${videoId}/hqdefault.jpg`);
      probe.src = maxres;
    });
  }

  // Note: there's no public, key-free YT Music metadata API we can call from
  // the browser, so this pulls title/artist/art from YouTube's oEmbed endpoint
  // (the same info YT Music itself is generated from — usually the channel
  // name and thumbnail of the official upload). It's a good starting guess,
  // not guaranteed to match, so every field can be fixed via Edit afterward.
  function fetchTitleFor(track, opts){
    opts = opts || {};
    fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${track.videoId}&format=json`)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        track.title = data.title || track.title;
        track.artist = opts.keepArtist || cleanArtist(data.author_name || track.artist);
        if(opts.keepAlbum) track.album = opts.keepAlbum;
        const artPromise = track.art ? Promise.resolve(track.art) : fetchBestThumbnail(track.videoId);
        return artPromise.then((artUrl) => {
          if(!track.art) track.art = artUrl;
        });
      })
      .then(() => {
        // Same song already imported under a different video link
        const dupe = findDuplicateTrack(track.title, track.artist, track.id);
        if(dupe){
          tracks = tracks.filter(t => t.id !== track.id);
          queue = queue.filter(t => t.id !== track.id);
          playlists.forEach(pl => { pl.trackIds = pl.trackIds.filter(id => id !== track.id); });
          if(current >= queue.length) current = Math.max(0, queue.length - 1);
          saveTracks(); savePlaylists();
          renderCrate(); renderPlaylistNav(); renderUpNext();
          showAddFeedback(`Already have "${dupe.title}"${cleanArtist(dupe.artist) ? ' by ' + cleanArtist(dupe.artist) : ''} in your library.`, track._feedbackTarget);
          return;
        }
        saveTracks();
        renderCrate(); renderUpNext();
        if(queue[current] && queue[current].id === track.id){
          trackTitle.textContent = track.title;
          trackArtist.textContent = track.artist;
          updateLabel(track);
        }
      })
      .catch(() => {
        track.title = 'Untitled track';
        saveTracks();
        renderCrate();
      });
  }

  document.getElementById('addBtn').addEventListener('click', addTrackFromUrl);
  document.getElementById('addUrlInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addTrackFromUrl();
  });

  document.getElementById('upnextAddBtn').addEventListener('click', addTrackFromUrlToUpNext);
  document.getElementById('upnextAddUrlInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addTrackFromUrlToUpNext();
  });

  const sortBtn = document.getElementById('sortBtn');
  const sortIndicator = document.getElementById('sortIndicator');
  function updateSortUI(){
    sortBtn.classList.toggle('active', sortMode !== 'added');
    if(sortMode === 'added'){
      sortIndicator.style.display = 'none';
      sortBtn.title = 'Smart sort: off';
    } else {
      sortIndicator.style.display = 'block';
      sortIndicator.textContent = 'Grouped by ' + (sortMode === 'artist' ? 'artist' : 'album');
      sortBtn.title = 'Smart sort: by ' + sortMode;
    }
  }
  sortBtn.addEventListener('click', () => {
    sortMode = sortMode === 'added' ? 'artist' : sortMode === 'artist' ? 'album' : 'added';
    updateSortUI();
    renderCrate();
  });

  // ---------- Albums view sort menu (A–Z / Z–A / By Artist) ----------
  const albumSortMenu = document.getElementById('albumSortMenu');
  const ALBUM_SORT_OPTIONS = [
    { key:'az', label:'A → Z' },
    { key:'za', label:'Z → A' },
    { key:'artist', label:'By Artist' }
  ];
  function closeAlbumSortMenu(){ albumSortMenu.classList.remove('show'); }
  albumSortBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeTrackContextMenu();
    albumSortMenu.innerHTML = ALBUM_SORT_OPTIONS.map(o => `
      <div class="tcm-item" data-sort="${o.key}">
        <div class="tcm-icon">${albumSortMode === o.key ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' : ''}</div>
        <div class="tcm-label">${o.label}</div>
      </div>
    `).join('');
    albumSortMenu.querySelectorAll('.tcm-item').forEach(el => {
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        albumSortMode = el.getAttribute('data-sort');
        renderCrate();
        closeAlbumSortMenu();
      });
    });
    const rect = albumSortBtn.getBoundingClientRect();
    albumSortMenu.style.top = (rect.bottom + 6) + 'px';
    albumSortMenu.style.left = Math.min(rect.left, window.innerWidth - 230) + 'px';
    albumSortMenu.classList.add('show');
  });
  document.addEventListener('click', (e) => {
    if(!albumSortMenu.contains(e.target) && e.target !== albumSortBtn && !albumSortBtn.contains(e.target)){
      closeAlbumSortMenu();
    }
  });

  // ---------- Add track directly into the currently-open album ----------
  function addTrackFromUrlToAlbum(){
    if(!extView || !extView.startsWith('album:')) return;
    const al = getAlbums().find(a => a.key === extView.slice('album:'.length));
    if(!al) return;
    const input = document.getElementById('albumAddUrlInput');
    const id = extractVideoId(input.value);
    if(!id){
      input.style.borderColor = 'var(--label-red)';
      setTimeout(() => { input.style.borderColor = ''; }, 1200);
      return;
    }
    const existingByVideo = tracks.find(t => t.videoId === id);
    if(existingByVideo){
      showAddFeedback(`Already in your library — "${existingByVideo.title}"${cleanArtist(existingByVideo.artist) ? ' by ' + cleanArtist(existingByVideo.artist) : ''}.`);
      input.value = '';
      return;
    }
    const newTrack = { id: uid(), title: 'Loading title…', artist: al.artist, album: al.name, art: '', videoId: id, _feedbackTarget: 'addFeedback' };
    tracks.unshift(newTrack);
    saveTracks();
    renderCrate(); renderPlaylistNav();
    input.value = '';
    fetchTitleFor(newTrack, { keepAlbum: al.name, keepArtist: al.artist });
  }
  document.getElementById('albumAddBtn').addEventListener('click', addTrackFromUrlToAlbum);
  document.getElementById('albumAddUrlInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addTrackFromUrlToAlbum();
  });

  // ---------- Playback core ----------
  function loadCurrent(autoplay){
    const t = queue[current];
    if(!t) return;
    elapsed = 0;
    trackTitle.textContent = t.title;
    trackArtist.textContent = cleanArtist(t.artist);
    updateLabel(t);
    applyRecordArt(t);
    renderCrate();
    updateNowPlayingHighlight();
    if(ytReady){
      ytPlayer.loadVideoById(t.videoId);
      applyVolume();
      if(!autoplay) ytPlayer.pauseVideo();
      setPlaying(autoplay);
    }
  }

  function setPlaying(state){
    playing = state;
    record.classList.toggle('spinning', playing);
    tonearm.classList.toggle('playing', playing);
    playIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    if(ytReady){ playing ? ytPlayer.playVideo() : ytPlayer.pauseVideo(); }
    if(crackleEnabled){ playing ? startCrackle() : stopCrackle(); } else { stopCrackle(); }
    clearInterval(timer);
    if(playing){ timer = setInterval(tick, 500); }
    updateNowPlayingHighlight();
    confirmPlaybackState(playing);
  }

  // The embedded YouTube iframe can briefly drop its connection — most
  // commonly when the browser's GPU process restarts after the window
  // moves to a display with a different refresh rate/DPI. During that gap
  // playVideo()/pauseVideo() calls are silently swallowed, so the UI (and
  // our own `playing` flag) can end up out of sync with what's actually
  // happening in the iframe. This re-checks the iframe's real state a
  // moment later and retries the command (with backoff) until it takes,
  // or gives up and reconciles the UI to reality after a few tries.
  let playbackConfirmToken = 0;
  function confirmPlaybackState(expectedPlaying, attempt = 0){
    const token = ++playbackConfirmToken;
    const delay = 400 + attempt * 500; // 400ms, 900ms, 1400ms, 1900ms...
    setTimeout(() => {
      if(token !== playbackConfirmToken) return; // a newer play/pause/track change superseded this check
      if(!ytReady || typeof ytPlayer.getPlayerState !== 'function') return;
      let state;
      try{ state = ytPlayer.getPlayerState(); }catch(e){ return; }
      // Only reconcile against the two states we can act on (playing/paused);
      // ignore transient states like CUED/UNSTARTED/BUFFERING — not a mismatch yet.
      if(state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.PAUSED) return;
      const actuallyPlaying = state === YT.PlayerState.PLAYING;
      if(actuallyPlaying === expectedPlaying) return; // command took, nothing to do

      if(attempt < 4){
        try{ expectedPlaying ? ytPlayer.playVideo() : ytPlayer.pauseVideo(); }catch(e){}
        confirmPlaybackState(expectedPlaying, attempt + 1);
      } else {
        // Give up retrying and reconcile our UI/state to what the iframe is
        // actually doing, rather than leaving the button showing a state
        // that silently does nothing when pressed.
        playing = actuallyPlaying;
        record.classList.toggle('spinning', playing);
        tonearm.classList.toggle('playing', playing);
        playIcon.innerHTML = playing
          ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
          : '<path d="M8 5v14l11-7z"/>';
        clearInterval(timer);
        if(playing){ timer = setInterval(tick, 500); }
        updateNowPlayingHighlight();
      }
    }, delay);
  }

  function tick(){
    if(!ytReady) return;
    elapsed = ytPlayer.getCurrentTime() || 0;
    duration = ytPlayer.getDuration() || duration;
    totalTimeEl.textContent = fmt(duration);
    updateProgress();
    maybeStartCrossfade();
  }

  function updateProgress(){
    const pct = duration ? Math.min(100, (elapsed / duration) * 100) : 0;
    progressFill.style.width = pct + '%';
    progressKnob.style.left = pct + '%';
    curTimeEl.textContent = fmt(elapsed);
  }

  function nextTrack(){
    if(queue.length === 0) return;
    cancelCrossfade();
    let nextIndex = current + 1;
    if(nextIndex >= queue.length) nextIndex = 0;
    current = nextIndex;
    loadCurrent(true);
  }

  function prevTrack(){
    if(queue.length === 0) return;
    cancelCrossfade();
    current = (current - 1 + queue.length) % queue.length;
    loadCurrent(true);
  }

  playBtn.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('nextBtn').addEventListener('click', nextTrack);
  document.getElementById('prevBtn').addEventListener('click', prevTrack);

  progressTrack.addEventListener('click', (e) => {
    if(!ytReady) return;
    cancelCrossfade();
    const rect = progressTrack.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    elapsed = pct * duration;
    ytPlayer.seekTo(elapsed, true);
    updateProgress();
  });

  // ---------- Crossfade / crackle toggles ----------
  const crossfadeBtn = document.getElementById('crossfadeBtn');
  const crackleBtn = document.getElementById('crackleBtn');
  function updateCrossfadeUI(){ crossfadeBtn.classList.toggle('active', crossfadeEnabled); }
  function updateCrackleUI(){ crackleBtn.classList.toggle('active', crackleEnabled); }
  crossfadeBtn.addEventListener('click', () => {
    crossfadeEnabled = !crossfadeEnabled;
    localStorage.setItem('spindle_crossfade', crossfadeEnabled ? '1' : '0');
    if(!crossfadeEnabled) cancelCrossfade();
    updateCrossfadeUI();
  });
  crackleBtn.addEventListener('click', () => {
    crackleEnabled = !crackleEnabled;
    localStorage.setItem('spindle_crackle', crackleEnabled ? '1' : '0');
    if(crackleEnabled && playing) startCrackle(); else stopCrackle();
    updateCrackleUI();
  });
  updateCrossfadeUI();
  updateCrackleUI();

  // ---------- Volume ----------
  const volumeMuteIconPath = '<path d="M16.5 12L19 9.5m0 5L16.5 12"/><path d="M3 10v4h4l5 5V5L7 10H3z"/>';
  function volumeIconMarkup(){
    if(muted || volume === 0){
      return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>';
    }
    if(volume < 50){
      return '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v8.06c1.5-.74 2.5-2.26 2.5-4.03z"/></svg>';
    }
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v8.06c1.5-.74 2.5-2.26 2.5-4.03z"/><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
  }
  function updateVolumeUI(){
    const pct = muted ? 0 : volume;
    volumeFill.style.width = pct + '%';
    volumeKnob.style.left = pct + '%';
    volumeIcon.innerHTML = volumeIconMarkup();
    volumeIcon.title = muted ? 'Unmute' : 'Mute';
  }
  function applyVolume(){
    if(ytReady) ytPlayer.setVolume(muted ? 0 : volume);
  }
  function setVolume(v){
    volume = Math.max(0, Math.min(100, Math.round(v)));
    if(volume > 0) muted = false;
    localStorage.setItem('spindle_volume', String(volume));
    applyVolume();
    updateVolumeUI();
  }
  function volumeFromEvent(e){
    const rect = volumeTrack.getBoundingClientRect();
    const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    return pct * 100;
  }
  let draggingVolume = false;
  volumeTrack.addEventListener('mousedown', (e) => {
    draggingVolume = true;
    setVolume(volumeFromEvent(e));
  });
  window.addEventListener('mousemove', (e) => {
    if(!draggingVolume) return;
    setVolume(volumeFromEvent(e));
  });
  window.addEventListener('mouseup', () => { draggingVolume = false; });
  volumeTrack.addEventListener('touchstart', (e) => { draggingVolume = true; setVolume(volumeFromEvent(e)); }, { passive:true });
  volumeTrack.addEventListener('touchmove', (e) => { if(draggingVolume) setVolume(volumeFromEvent(e)); }, { passive:true });
  volumeTrack.addEventListener('touchend', () => { draggingVolume = false; });
  volumeIcon.addEventListener('click', () => {
    if(muted || volume === 0){
      muted = false;
      volume = prevVolume > 0 ? prevVolume : 80;
    } else {
      prevVolume = volume;
      muted = true;
    }
    localStorage.setItem('spindle_volume', String(volume));
    applyVolume();
    updateVolumeUI();
  });
  updateVolumeUI();

  // ---------- Shuffle / repeat ----------
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const repeatOneDot = document.getElementById('repeatOneDot');

  function updateShuffleUI(){ shuffleBtn.classList.toggle('active', shuffle); }
  function updateRepeatUI(){
    repeatBtn.classList.toggle('active', repeatMode !== 'off');
    repeatOneDot.classList.toggle('show', repeatMode === 'one');
    repeatBtn.title = repeatMode === 'off' ? 'Repeat off' : repeatMode === 'all' ? 'Repeat playlist' : 'Repeat one song';
  }
  shuffleBtn.addEventListener('click', () => {
    shuffle = !shuffle;
    localStorage.setItem('spindle_shuffle', shuffle ? '1' : '0');
    const playingId = queue[current] ? queue[current].id : null;
    if(shuffle){
      // Snapshot the current order so turning shuffle back off restores it,
      // then shuffle everything except the playing track — which stays put
      // so nothing jumps mid-song — into a real new queue order you can see.
      preShuffleQueue = queue.slice();
      const rest = queue.filter((_, i) => i !== current);
      const shuffledRest = shuffleArray(rest);
      const playingTrack = queue[current];
      queue = [
        ...shuffledRest.slice(0, current),
        ...(playingTrack ? [playingTrack] : []),
        ...shuffledRest.slice(current)
      ];
    } else if(preShuffleQueue){
      queue = preShuffleQueue.slice();
      preShuffleQueue = null;
    }
    if(playingId){
      const idx = queue.findIndex(t => t.id === playingId);
      if(idx !== -1) current = idx;
    }
    updateShuffleUI();
    renderUpNext();
  });
  repeatBtn.addEventListener('click', () => {
    repeatMode = repeatMode === 'off' ? 'all' : repeatMode === 'all' ? 'one' : 'off';
    localStorage.setItem('spindle_repeat', repeatMode);
    updateRepeatUI();
  });

  // ---------- Brand click: shuffle-play everything ----------
  document.getElementById('brandBtn').addEventListener('click', () => {
    if(tracks.length === 0) return;
    shuffle = true;
    localStorage.setItem('spindle_shuffle', '1');
    updateShuffleUI();
    setQueue(tracks, 'All Songs');
    current = 0; // queue is already shuffled, so this lands somewhere new each time
    renderUpNext();
    loadCurrent(true);
  });

  // ---------- Edit song modal ----------
  const editOverlay = document.getElementById('editOverlay');
  const editTitleInput = document.getElementById('editTitleInput');
  const editArtistInput = document.getElementById('editArtistInput');
  const editAlbumInput = document.getElementById('editAlbumInput');
  const editTrackInput = document.getElementById('editTrackInput');
  const trackStepUp = document.getElementById('trackStepUp');
  const trackStepDown = document.getElementById('trackStepDown');
  trackStepUp.addEventListener('click', () => {
    const cur = parseInt(editTrackInput.value, 10);
    editTrackInput.value = Number.isFinite(cur) ? cur + 1 : 1;
  });
  trackStepDown.addEventListener('click', () => {
    const cur = parseInt(editTrackInput.value, 10);
    const next = Number.isFinite(cur) ? cur - 1 : 1;
    editTrackInput.value = next > 0 ? next : 1;
  });
  const editArtUrlInput = document.getElementById('editArtUrlInput');
  const editArtFileInput = document.getElementById('editArtFileInput');
  const editArtPreview = document.getElementById('editArtPreview');
  let editingTrackId = null;
  let editingArtData = '';

  function updateEditArtPreview(src){
    editArtPreview.style.backgroundImage = src ? `url("${src}")` : 'none';
  }

  function openEditModal(trackId){
    const t = trackById(trackId);
    if(!t) return;
    editingTrackId = trackId;
    editingArtData = (t.art && t.art.startsWith('data:')) ? t.art : '';
    editTitleInput.value = t.title || '';
    editArtistInput.value = cleanArtist(t.artist);
    editAlbumInput.value = t.album || '';
    editTrackInput.value = Number.isFinite(t.trackNo) ? t.trackNo : '';
    editArtUrlInput.value = (t.art && !t.art.startsWith('data:')) ? t.art : '';
    editArtFileInput.value = '';
    updateEditArtPreview(t.art || '');
    editOverlay.classList.add('show');
  }
  function closeEditModal(){
    editOverlay.classList.remove('show');
    editingTrackId = null;
    editingArtData = '';
    closeAlbumSuggest();
  }

  // ---------- Smart album suggestions (matched against the typed artist) ----------
  const albumSuggest = document.getElementById('albumSuggest');
  function closeAlbumSuggest(){ albumSuggest.classList.remove('show'); }
  function albumSuggestionsFor(query, artistTyped){
    const q = query.trim().toLowerCase();
    const artistKey = normKey(cleanArtist(artistTyped));
    const seen = new Map(); // album name (lowercased) -> { name, artist }
    tracks.forEach(t => {
      const name = (t.album || '').trim();
      if(!name) return;
      if(t.id === editingTrackId) return;
      const key = name.toLowerCase();
      if(seen.has(key)) return;
      const trackArtistKey = normKey(cleanArtist(t.artist));
      // Prioritize albums by the same artist that's currently typed; if no
      // artist is typed yet, fall back to matching against any album.
      if(artistKey && trackArtistKey !== artistKey) return;
      if(q && !key.includes(q)) return;
      seen.set(key, { name, artist: cleanArtist(t.artist) });
    });
    return Array.from(seen.values())
      .sort((a, b) => {
        const aStarts = a.name.toLowerCase().startsWith(q) ? 0 : 1;
        const bStarts = b.name.toLowerCase().startsWith(q) ? 0 : 1;
        return aStarts - bStarts || a.name.localeCompare(b.name);
      })
      .slice(0, 6);
  }
  function renderAlbumSuggestions(){
    const query = editAlbumInput.value;
    if(!query.trim()){ closeAlbumSuggest(); return; }
    const results = albumSuggestionsFor(query, editArtistInput.value);
    if(results.length === 0){ closeAlbumSuggest(); return; }
    albumSuggest.innerHTML = results.map(r => `
      <div class="as-item" data-name="${escapeHtml(r.name)}">${escapeHtml(r.name)}${r.artist ? ` <span>· ${escapeHtml(r.artist)}</span>` : ''}</div>
    `).join('');
    albumSuggest.querySelectorAll('.as-item').forEach(el => {
      el.addEventListener('mousedown', (e) => {
        // mousedown (not click) so this fires before the input's blur closes the list
        e.preventDefault();
        editAlbumInput.value = el.getAttribute('data-name');
        closeAlbumSuggest();
      });
    });
    albumSuggest.classList.add('show');
  }
  editAlbumInput.addEventListener('input', renderAlbumSuggestions);
  editAlbumInput.addEventListener('focus', renderAlbumSuggestions);
  editArtistInput.addEventListener('input', () => { if(document.activeElement === editAlbumInput) renderAlbumSuggestions(); });
  editAlbumInput.addEventListener('blur', () => closeAlbumSuggest());

  editArtUrlInput.addEventListener('input', () => {
    editingArtData = '';
    updateEditArtPreview(editArtUrlInput.value.trim());
  });
  editArtFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      editingArtData = reader.result;
      editArtUrlInput.value = '';
      updateEditArtPreview(editingArtData);
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('editSaveBtn').addEventListener('click', () => {
    const t = trackById(editingTrackId);
    if(!t) return;
    t.title = editTitleInput.value.trim() || t.title;
    t.artist = cleanArtist(editArtistInput.value.trim());
    t.album = editAlbumInput.value.trim();
    const trackNoRaw = editTrackInput.value.trim();
    const trackNoNum = trackNoRaw === '' ? NaN : parseInt(trackNoRaw, 10);
    t.trackNo = Number.isFinite(trackNoNum) && trackNoNum > 0 ? trackNoNum : null;
    const urlArt = editArtUrlInput.value.trim();
    t.art = editingArtData || urlArt || '';
    saveTracks();
    renderCrate(); renderPlaylistNav(); renderUpNext();
    if(queue[current] && queue[current].id === t.id){
      trackTitle.textContent = t.title;
      trackArtist.textContent = cleanArtist(t.artist);
      updateLabel(t);
      applyRecordArt(t);
    }
    closeEditModal();
  });
  document.getElementById('editCancelBtn').addEventListener('click', closeEditModal);
  document.getElementById('editCloseX').addEventListener('click', closeEditModal);
  editOverlay.addEventListener('click', (e) => { if(e.target === editOverlay) closeEditModal(); });

  // ---------- Edit album modal ----------
  // Editing an album applies the name/artist/art change to every track that
  // currently shares this album's (name + artist) key — that's what keeps
  // "same album, same artist" songs grouped, and lets one art upload cover
  // the whole album at once.
  const albumEditOverlay = document.getElementById('albumEditOverlay');
  const albumEditNameInput = document.getElementById('albumEditNameInput');
  const albumEditArtistInput = document.getElementById('albumEditArtistInput');
  const albumEditArtUrlInput = document.getElementById('albumEditArtUrlInput');
  const albumEditArtFileInput = document.getElementById('albumEditArtFileInput');
  const albumEditArtPreview = document.getElementById('albumEditArtPreview');
  let editingAlbumKey = null;
  let editingAlbumArtData = '';

  function updateAlbumEditArtPreview(src){
    albumEditArtPreview.style.backgroundImage = src ? `url("${src}")` : 'none';
  }

  function openAlbumEditModal(key){
    const al = getAlbums().find(a => a.key === key);
    if(!al) return;
    editingAlbumKey = key;
    const art = albumArtFor(al);
    editingAlbumArtData = art.startsWith('data:') ? art : '';
    albumEditNameInput.value = al.name;
    albumEditArtistInput.value = al.artist;
    albumEditArtUrlInput.value = (art && !art.startsWith('data:')) ? art : '';
    albumEditArtFileInput.value = '';
    updateAlbumEditArtPreview(art);
    albumEditOverlay.classList.add('show');
  }
  function closeAlbumEditModal(){
    albumEditOverlay.classList.remove('show');
    editingAlbumKey = null;
    editingAlbumArtData = '';
  }

  albumEditArtUrlInput.addEventListener('input', () => {
    editingAlbumArtData = '';
    updateAlbumEditArtPreview(albumEditArtUrlInput.value.trim());
  });
  albumEditArtFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      editingAlbumArtData = reader.result;
      albumEditArtUrlInput.value = '';
      updateAlbumEditArtPreview(editingAlbumArtData);
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('albumEditSaveBtn').addEventListener('click', () => {
    if(!editingAlbumKey) return;
    const newName = albumEditNameInput.value.trim();
    if(!newName) return;
    const newArtist = albumEditArtistInput.value.trim();
    const urlArt = albumEditArtUrlInput.value.trim();
    const newArt = editingAlbumArtData || urlArt || '';
    const affected = tracks.filter(t => (t.album || '').trim() && albumKey(t.album, t.artist) === editingAlbumKey);
    affected.forEach(t => {
      t.album = newName;
      if(newArtist) t.artist = newArtist;
      if(newArt) t.art = newArt;
    });
    saveTracks();
    renderCrate(); renderPlaylistNav(); renderUpNext();
    if(queue[current] && affected.some(t => t.id === queue[current].id)){
      const t = queue[current];
      trackTitle.textContent = t.title;
      trackArtist.textContent = cleanArtist(t.artist);
      updateLabel(t);
      applyRecordArt(t);
    }
    closeAlbumEditModal();
    openExtPanel('albums');
  });
  document.getElementById('albumEditCancelBtn').addEventListener('click', closeAlbumEditModal);
  document.getElementById('albumEditCloseX').addEventListener('click', closeAlbumEditModal);
  albumEditOverlay.addEventListener('click', (e) => { if(e.target === albumEditOverlay) closeAlbumEditModal(); });

  // ---------- Init ----------
  if(shuffle) queue = shuffleArray(queue); // keep the queue consistent with a persisted shuffle preference
  updateShuffleUI();
  updateRepeatUI();
  updateSortUI();
  extView = 'all';
  renderPlaylistNav();
  renderCrate();
  closeExtPanel(); // start closed, just initializes state cleanly
  trackTitle.textContent = queue[0] ? queue[0].title : '—';
  trackArtist.textContent = queue[0] ? cleanArtist(queue[0].artist) : '—';
  updateLabel(queue[0]);
  record.classList.toggle('layout-embed', vinylLayout === 'embed');
  record.classList.toggle('layout-tinted', vinylLayout === 'tinted');
  labelEl.classList.toggle('layout-embed', vinylLayout === 'embed');
  platterWrap.classList.toggle('layout-tinted', vinylLayout === 'tinted');
  layoutBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.layout === vinylLayout));
  applyRecordArt(queue[0]);
  renderUpNext();
  syncVolumeRowWidth();

  // ---------- PWA install support ----------
  // Only registers when served over http(s) (file:// pages can't use service
  // workers), so this is a no-op harmlessly if you're just double-clicking
  // the file. Serve the folder (e.g. `npx serve`) or host it to get the
  // "Add to Home Screen" / install-as-app prompt.
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
