<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spindle — Vinyl Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --walnut-dark: #241713;
    --walnut: #3b241c;
    --walnut-light: #55342a;
    --brass: #c99a54;
    --brass-bright: #e8bd7a;
    --cream: #f4ead9;
    --label-red: #a3312a;
    --label-red-dark: #7c231d;
    --shadow: rgba(0,0,0,0.55);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 30% 0%, #2c1b15 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, #1c110d 0%, transparent 55%),
      linear-gradient(160deg, var(--walnut-dark), #150d0a 70%);
    color: var(--cream);
    font-family: 'JetBrains Mono', monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .console{
    width: 100%;
    max-width: 560px;
    background:
      repeating-linear-gradient(100deg, rgba(0,0,0,0.08) 0 2px, transparent 2px 6px),
      linear-gradient(150deg, var(--walnut-light), var(--walnut) 60%, var(--walnut-dark));
    border-radius: 18px;
    padding: 28px 26px 22px;
    box-shadow: 0 30px 60px var(--shadow), inset 0 0 0 1px rgba(201,154,84,0.15);
    position:relative;
  }

  .console::before{
    content:"";
    position:absolute; inset:10px;
    border-radius: 12px;
    border: 1px solid rgba(201,154,84,0.18);
    pointer-events:none;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(201,154,84,0.2);
  }

  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--brass-bright);
  }
  .brand span{ color: var(--cream); font-weight:400; opacity:0.7; }

  .badge{
    font-size:10px;
    letter-spacing: 2px;
    text-transform:uppercase;
    color: rgba(244,234,217,0.55);
  }

  .menu-btn{
    background:none; border:none; cursor:pointer;
    color: var(--brass-bright);
    opacity: 0.85;
    padding: 4px;
    display:flex; align-items:center;
    transition: opacity 0.15s ease;
  }
  .menu-btn:hover{ opacity:1; }

  .sidebar-overlay{
    position: fixed; inset: 0;
    background: rgba(10,6,4,0.55);
    backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 40;
  }
  .sidebar-overlay.open{ opacity: 1; pointer-events: auto; }

  .sidebar{
    position: fixed;
    top: 0; left: 0;
    height: 100%;
    width: min(340px, 88vw);
    background: linear-gradient(170deg, var(--walnut-light), var(--walnut-dark));
    box-shadow: 8px 0 30px rgba(0,0,0,0.5);
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(.65,0,.35,1);
    z-index: 50;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(201,154,84,0.2);
  }
  .sidebar.open{ transform: translateX(0); }

  .sidebar-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(201,154,84,0.2);
  }
  .sidebar-title{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--brass-bright);
  }
  .sidebar-close{
    background:none; border:none; cursor:pointer;
    color: rgba(244,234,217,0.6);
    padding: 4px;
    display:flex;
  }
  .sidebar-close:hover{ color: var(--cream); }

  .sidebar .crate{
    flex: 1;
    max-height: none;
  }

  /* ---- Turntable plinth ---- */
  .platter-wrap{
    position:relative;
    width: 100%;
    aspect-ratio: 1/1;
    max-width: 400px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a1a13, #150c08 75%);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 0 10px 20px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
  }

  .record{
    position:relative;
    width: 86%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #0b0b0c 0px, #0b0b0c 2px,
        #191919 3px, #191919 4px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.04);
    animation: spin 6s linear infinite;
    animation-play-state: paused;
    display:flex; align-items:center; justify-content:center;
  }

  .record.spinning{ animation-play-state: running; }

  .record::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background: linear-gradient(120deg, rgba(255,255,255,0.10), transparent 40%);
    pointer-events:none;
  }

  .label{
    width: 34%;
    aspect-ratio:1/1;
    border-radius:50%;
    background: radial-gradient(circle at 40% 35%, var(--label-red), var(--label-red-dark) 80%);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.15);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    position:relative;
  }
  .label::before{
    content:"";
    position:absolute; width:10px; height:10px; border-radius:50%;
    background: var(--walnut-dark);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .label-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 10px;
    letter-spacing:0.5px;
    line-height:1.2;
    padding: 0 10px;
    color: rgba(244,234,217,0.92);
    max-width: 90%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .label-sub{
    font-size: 7px;
    letter-spacing: 2px;
    text-transform:uppercase;
    color: rgba(244,234,217,0.55);
    margin-top:3px;
  }

  /* ---- Tonearm ---- */
  .tonearm{
    position:absolute;
    top: -6%;
    right: -2%;
    width: 46%;
    height: 46%;
    transform-origin: 88% 12%;
    transform: rotate(-24deg);
    transition: transform 0.9s cubic-bezier(.65,0,.35,1);
    z-index: 5;
    pointer-events:none;
  }
  .tonearm.playing{ transform: rotate(2deg); }

  .arm-base{
    position:absolute; top:2%; right:6%;
    width: 22px; height:22px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass) 70%, #8a6534);
    box-shadow: 0 3px 6px rgba(0,0,0,0.5);
  }
  .arm-rod{
    position:absolute; top: 10%; right: 15%;
    width: 5px; height: 78%;
    border-radius: 3px;
    background: linear-gradient(90deg, #8a6534, var(--brass-bright) 45%, #8a6534);
    transform-origin: top center;
    box-shadow: 1px 0 2px rgba(0,0,0,0.4);
  }
  .arm-head{
    position:absolute; bottom: 4%; left: 50%;
    transform: translateX(-50%) rotate(20deg);
    width: 16px; height: 9px; border-radius: 2px;
    background: linear-gradient(160deg, #2a2a2a, #0d0d0d);
    box-shadow: 0 2px 3px rgba(0,0,0,0.5);
  }

  /* ---- Now playing text ---- */
  .now-playing{
    text-align:center;
    margin: 14px 0 18px;
  }
  .track-title{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    color: var(--cream);
    margin-bottom: 4px;
  }
  .track-artist{
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--brass);
  }

  /* ---- Progress ---- */
  .progress-row{
    display:flex; align-items:center; gap:10px;
    font-size: 10px; color: rgba(244,234,217,0.6);
    margin-bottom: 18px;
  }
  .progress-track{
    flex:1; height: 3px; border-radius: 2px;
    background: rgba(244,234,217,0.15);
    position:relative; cursor:pointer;
  }
  .progress-fill{
    position:absolute; left:0; top:0; height:100%;
    width: 0%;
    background: linear-gradient(90deg, var(--brass), var(--brass-bright));
    border-radius: 2px;
  }
  .progress-knob{
    position:absolute; top:50%; width:9px; height:9px; border-radius:50%;
    background: var(--brass-bright);
    transform: translate(-50%,-50%);
    left:0%;
    box-shadow: 0 0 6px rgba(232,189,122,0.7);
  }

  /* ---- Controls ---- */
  .controls{
    display:flex; align-items:center; justify-content:center; gap:22px;
    margin-bottom: 22px;
  }
  .ctrl-btn{
    background:none; border:none; cursor:pointer;
    color: var(--cream);
    opacity:0.85;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .ctrl-btn:hover{ opacity:1; transform: translateY(-1px); }
  .ctrl-btn:active{ transform: translateY(1px) scale(0.94); }

  .play-btn{
    width:52px; height:52px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass) 75%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.4);
    color: var(--walnut-dark);
  }

  /* ---- Playlist / crate ---- */
  .crate-label{
    font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color: rgba(244,234,217,0.5);
    margin-bottom: 10px;
    padding-top: 14px;
    border-top: 1px solid rgba(201,154,84,0.2);
  }
  .crate{
    display:flex; flex-direction:column; gap:2px;
    max-height: 220px;
    overflow-y:auto;
  }
  .crate::-webkit-scrollbar{ width:6px; }
  .crate::-webkit-scrollbar-thumb{ background: rgba(201,154,84,0.3); border-radius:3px; }

  .track-row{
    display:flex; align-items:center; gap:12px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  .track-row:hover{ background: rgba(244,234,217,0.06); }
  .track-row.active{ background: rgba(201,154,84,0.15); }

  .mini-disc{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    background: repeating-radial-gradient(circle, #0b0b0c 0 1px, #1c1c1c 1.5px 2px);
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .mini-disc::after{
    content:""; width:8px; height:8px; border-radius:50%;
    background: var(--label-red);
  }

  .track-meta{ flex:1; min-width:0; }
  .track-meta .t{ font-size:12.5px; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-meta .a{ font-size:10px; color:rgba(244,234,217,0.5); }
  .track-dur{ font-size:10px; color: rgba(244,234,217,0.4); }

  .add-row{
    display:flex; gap:8px; margin-bottom: 4px;
  }
  .add-row input{
    flex:1;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(201,154,84,0.25);
    border-radius: 8px;
    padding: 9px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--cream);
    outline: none;
  }
  .add-row input::placeholder{ color: rgba(244,234,217,0.35); }
  .add-row input:focus{ border-color: var(--brass); }
  .add-row button{
    background: linear-gradient(160deg, var(--brass-bright), var(--brass));
    color: var(--walnut-dark);
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .add-row button:hover{ filter: brightness(1.05); }

  .remove-btn{
    background:none; border:none; cursor:pointer;
    color: rgba(244,234,217,0.35);
    padding: 2px 4px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .track-row:hover .remove-btn{ opacity: 1; }
  .remove-btn:hover{ color: var(--label-red); }

  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .record{ animation: none !important; }
    .tonearm{ transition: none; }
  }

  @media (max-width: 420px){
    .console{ padding: 20px 16px 16px; }
    .track-title{ font-size:16px; }
  }
</style>
</head>
<body>

<div class="console">
  <header>
    <button class="menu-btn" id="menuBtn" title="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <div class="brand">Spindle <span>/ vinyl mode</span></div>
    <div class="badge">33⅓ rpm</div>
  </header>

  <div class="platter-wrap">
    <div class="record" id="record">
      <div class="label" id="label">
        <div class="label-title" id="labelTitle">Weightless</div>
        <div class="label-sub">Side A</div>
      </div>
    </div>
    <div class="tonearm" id="tonearm">
      <div class="arm-base"></div>
      <div class="arm-rod"></div>
      <div class="arm-head"></div>
    </div>
  </div>

  <div class="now-playing">
    <div class="track-title" id="trackTitle">Weightless</div>
    <div class="track-artist" id="trackArtist">Marlowe Bay</div>
  </div>

  <div class="progress-row">
    <span id="curTime">0:00</span>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-knob" id="progressKnob"></div>
    </div>
    <span id="totalTime">3:24</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" title="Previous">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
      <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" id="nextBtn" title="Next">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>
    </button>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <div class="sidebar-title">Your crate</div>
    <button class="sidebar-close" id="sidebarClose" title="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="add-row">
    <input type="text" id="addUrlInput" placeholder="Paste a YouTube link…" />
    <button id="addBtn" title="Add track">Add</button>
  </div>

  <div class="crate-label">Tracks</div>
  <div class="crate" id="crate"></div>
</aside>

<!-- Hidden YouTube player: provides real audio -->
<div id="ytPlayer" style="position:absolute; width:1px; height:1px; overflow:hidden; opacity:0;"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // Default seed tracks (used only the very first time, before anything is saved)
  const DEFAULT_TRACKS = [
    { title: "Track One", artist: "Artist Name", videoId: "dQw4w9WgXcQ" },
  ];

  const STORAGE_KEY = 'spindle_tracks_v1';

  function loadTracksFromStorage(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length) return parsed;
      }
    }catch(e){ console.warn('Could not read saved tracks', e); }
    return DEFAULT_TRACKS.slice();
  }

  function saveTracksToStorage(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tracks));
    }catch(e){ console.warn('Could not save tracks', e); }
  }

  let tracks = loadTracksFromStorage();

  let current = 0;
  let playing = false;
  let elapsed = 0;
  let duration = 0;
  let timer = null;
  let ytPlayer = null;
  let ytReady = false;

  function onYouTubeIframeAPIReady(){
    ytPlayer = new YT.Player('ytPlayer', {
      height: '1', width: '1',
      videoId: tracks[0].videoId,
      playerVars: { autoplay: 0, controls: 0, disablekb: 1 },
      events: {
        onReady: () => { ytReady = true; duration = ytPlayer.getDuration() || 0; totalTimeEl.textContent = fmt(duration); },
        onStateChange: (e) => {
          if(e.data === YT.PlayerState.ENDED){ nextTrack(); }
        }
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  const record = document.getElementById('record');
  const tonearm = document.getElementById('tonearm');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const labelTitle = document.getElementById('labelTitle');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const progressFill = document.getElementById('progressFill');
  const progressKnob = document.getElementById('progressKnob');
  const progressTrack = document.getElementById('progressTrack');
  const curTimeEl = document.getElementById('curTime');
  const totalTimeEl = document.getElementById('totalTime');
  const crate = document.getElementById('crate');

  function fmt(s){
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return m + ":" + String(sec).padStart(2,'0');
  }

  function renderCrate(){
    crate.innerHTML = '';
    tracks.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'track-row' + (i === current ? ' active' : '');
      row.innerHTML = `
        <div class="mini-disc"></div>
        <div class="track-meta">
          <div class="t">${escapeHtml(t.title)}</div>
          <div class="a">${escapeHtml(t.artist)}</div>
        </div>
        <button class="remove-btn" title="Remove">✕</button>
      `;
      row.querySelector('.track-meta').addEventListener('click', () => loadTrack(i, true));
      row.querySelector('.mini-disc').addEventListener('click', () => loadTrack(i, true));
      row.querySelector('.remove-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTrack(i);
      });
      crate.appendChild(row);
    });
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function removeTrack(i){
    tracks.splice(i, 1);
    if(tracks.length === 0){
      tracks = DEFAULT_TRACKS.slice();
    }
    if(current >= tracks.length) current = tracks.length - 1;
    saveTracksToStorage();
    loadTrack(current, false);
  }

  // Extracts a YouTube video ID from any common URL shape, or a raw 11-char ID
  function extractVideoId(input){
    input = input.trim();
    const patterns = [
      /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/,
    ];
    for(const re of patterns){
      const m = input.match(re);
      if(m) return m[1];
    }
    if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
    return null;
  }

  function addTrackFromUrl(){
    const input = document.getElementById('addUrlInput');
    const val = input.value;
    const id = extractVideoId(val);
    if(!id){
      input.style.borderColor = 'var(--label-red)';
      setTimeout(() => { input.style.borderColor = ''; }, 1200);
      return;
    }
    const newTrack = { title: 'Loading title…', artist: '', videoId: id };
    tracks.push(newTrack);
    saveTracksToStorage();
    renderCrate();
    input.value = '';
    fetchTitleFor(newTrack);
  }

  // Uses YouTube's oEmbed endpoint (no API key needed) to fetch the real title/author
  function fetchTitleFor(track){
    fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${track.videoId}&format=json`)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        track.title = data.title || track.title;
        track.artist = data.author_name || track.artist;
        saveTracksToStorage();
        renderCrate();
        if(tracks[current] === track){
          trackTitle.textContent = track.title;
          trackArtist.textContent = track.artist;
          labelTitle.textContent = track.title;
        }
      })
      .catch(() => {
        track.title = 'Untitled track';
        saveTracksToStorage();
        renderCrate();
      });
  }

  function loadTrack(i, autoplay){
    current = i;
    elapsed = 0;
    const t = tracks[i];
    trackTitle.textContent = t.title;
    trackArtist.textContent = t.artist;
    labelTitle.textContent = t.title;
    renderCrate();
    if(ytReady){
      ytPlayer.loadVideoById(t.videoId);
      if(!autoplay) ytPlayer.pauseVideo();
      setPlaying(autoplay);
    }
  }

  function setPlaying(state){
    playing = state;
    record.classList.toggle('spinning', playing);
    tonearm.classList.toggle('playing', playing);
    playIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    if(ytReady){
      playing ? ytPlayer.playVideo() : ytPlayer.pauseVideo();
    }
    clearInterval(timer);
    if(playing){ timer = setInterval(tick, 500); }
  }

  function tick(){
    if(!ytReady) return;
    elapsed = ytPlayer.getCurrentTime() || 0;
    duration = ytPlayer.getDuration() || duration;
    totalTimeEl.textContent = fmt(duration);
    updateProgress();
  }

  function updateProgress(){
    const pct = duration ? Math.min(100, (elapsed / duration) * 100) : 0;
    progressFill.style.width = pct + '%';
    progressKnob.style.left = pct + '%';
    curTimeEl.textContent = fmt(elapsed);
  }

  function nextTrack(){
    loadTrack((current + 1) % tracks.length, true);
  }
  function prevTrack(){
    loadTrack((current - 1 + tracks.length) % tracks.length, true);
  }

  playBtn.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('nextBtn').addEventListener('click', nextTrack);
  document.getElementById('prevBtn').addEventListener('click', prevTrack);

  progressTrack.addEventListener('click', (e) => {
    if(!ytReady) return;
    const rect = progressTrack.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    elapsed = pct * duration;
    ytPlayer.seekTo(elapsed, true);
    updateProgress();
  });

  document.getElementById('addBtn').addEventListener('click', addTrackFromUrl);
  document.getElementById('addUrlInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addTrackFromUrl();
  });

  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  function openSidebar(){
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('open');
  }
  function closeSidebar(){
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
  }
  document.getElementById('menuBtn').addEventListener('click', openSidebar);
  document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeSidebar(); });

  trackTitle.textContent = tracks[0].title;
  trackArtist.textContent = tracks[0].artist;
  labelTitle.textContent = tracks[0].title;
  renderCrate();
</script>

</body>
</html>
